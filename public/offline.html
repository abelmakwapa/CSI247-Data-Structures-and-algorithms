<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Algo Atlas — Offline</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; background: #f5f7fa; color: #1a1a2e; }
      body { min-width: 320px; margin: 0; }
      main { max-width: 680px; margin: 0 auto; padding: 12vh 24px; }
      section { padding: 36px 30px; border: 1px solid #d0d8e8; border-top: 6px solid #b52b2b; background: #fff; box-shadow: 0 12px 30px rgba(13, 27, 46, .08); }
      p { font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.65; }
      .eyebrow { color: #596577; font-family: 'SFMono-Regular', Consolas, monospace; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
      a { display: inline-block; margin-top: 14px; padding: 10px 13px; border: 1px solid #2563a8; color: #fff; background: #2563a8; font-family: 'SFMono-Regular', Consolas, monospace; font-size: .76rem; text-decoration: none; }
      a:focus-visible { outline: 3px solid #005fcc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="offline-title">
        <p class="eyebrow">Algo Atlas · Offline mode</p>
        <h1 id="offline-title">This topic is not cached yet.</h1>
        <p>Reconnect to open it once. Previously visited topics, diagrams, and your local study state remain available while you are offline.</p>
        <a href="/">Return to the study guide</a>
      </section>
    </main>
  </body>
</html>
